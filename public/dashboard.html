<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eventos | Gerenciamento de Eventos</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Gerenciamento de Eventos</h1>
      <p>Cadastre, consulte, edite e exclua eventos.</p>
    </div>
    <button id="logoutButton" class="secondary">Sair</button>
  </header>

  <main class="container">
    <section class="panel">
      <h2 id="formTitle">Cadastrar evento</h2>
      <form id="eventForm" class="event-form">
        <input type="hidden" id="eventId" />

        <label for="nome">Nome *</label>
        <input id="nome" required />

        <label for="descricao">Descrição</label>
        <textarea id="descricao" rows="3"></textarea>

        <div class="grid-2">
          <div>
            <label for="data">Data *</label>
            <input id="data" type="date" required />
          </div>
          <div>
            <label for="horario">Horário *</label>
            <input id="horario" type="time" required />
          </div>
        </div>

        <label for="local">Local *</label>
        <input id="local" required />

        <div class="grid-2">
          <div>
            <label for="vagas">Quantidade de vagas *</label>
            <input id="vagas" type="number" min="1" value="100" required />
          </div>
          <div>
            <label for="status">Status *</label>
            <select id="status" required>
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
              <option value="Concluído">Concluído</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="saveButton">Cadastrar</button>
          <button type="button" id="cancelButton" class="secondary hidden">Cancelar edição</button>
        </div>
      </form>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="section-header">
        <h2>Eventos cadastrados</h2>
        <button id="refreshButton" class="secondary">Atualizar lista</button>
      </div>
      <div id="eventsContainer"></div>
    </section>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
