<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Gerenciamento de Eventos</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Gerenciamento de Eventos</h1>
    <p class="muted">Acesse sua conta para gerenciar os eventos.</p>

    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" value="usuario@email.com" required />

      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" value="123456" required />

      <button type="submit">Entrar</button>
    </form>

    <p id="loginMessage" class="message" aria-live="polite"></p>
    <p class="hint">Usuário de teste: usuario@email.com | senha: 123456</p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
